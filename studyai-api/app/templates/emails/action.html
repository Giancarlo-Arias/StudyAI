<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>StudyAI</title>
</head>

<body style="
  margin: 0;
  padding: 0;
  background-color: #f4f6fb;
  font-family: Arial, Helvetica, sans-serif;
  color: #172033;
">

  <div style="
    display: none;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    color: transparent;
  ">
    $preheader
  </div>

  <table
    role="presentation"
    cellpadding="0"
    cellspacing="0"
    border="0"
    width="100%"
    style="background-color: #f4f6fb;"
  >
    <tr>
      <td align="center" style="padding: 48px 16px;">

        <table
          role="presentation"
          cellpadding="0"
          cellspacing="0"
          border="0"
          width="100%"
          style="max-width: 560px;"
        >

          <tr>
            <td align="center" style="padding-bottom: 28px;">

              <span style="
                font-size: 28px;
                font-weight: 800;
                letter-spacing: -1.5px;
                color: #18223a;
              ">
                Study<span style="color: #6366f1;">AI</span>
              </span>

            </td>
          </tr>

          <tr>
            <td style="
              background-color: #ffffff;
              border: 1px solid #e7eaf2;
              border-radius: 20px;
              overflow: hidden;
            ">

              <table
                role="presentation"
                cellpadding="0"
                cellspacing="0"
                border="0"
                width="100%"
              >

                <tr>
                  <td style="
                    height: 6px;
                    background-color: #6366f1;
                    font-size: 0;
                    line-height: 0;
                  ">
                    &nbsp;
                  </td>
                </tr>

                <tr>
                  <td style="padding: 44px 36px 20px;">

                    <table
                      role="presentation"
                      cellpadding="0"
                      cellspacing="0"
                      border="0"
                    >
                      <tr>
                        <td
                          align="center"
                          style="
                            width: 56px;
                            height: 56px;
                            background-color: #eef2ff;
                            border-radius: 16px;
                            font-size: 28px;
                          "
                        >
                          &#10024;
                        </td>
                      </tr>
                    </table>

                    <p style="
                      margin: 28px 0 10px;
                      font-size: 12px;
                      font-weight: 700;
                      letter-spacing: 1.5px;
                      text-transform: uppercase;
                      color: #6366f1;
                    ">
                      Seguridad de tu cuenta
                    </p>

                    <h1 style="
                      margin: 0;
                      font-size: 28px;
                      line-height: 1.3;
                      font-weight: 700;
                      letter-spacing: -0.8px;
                      color: #172033;
                    ">
                      $title
                    </h1>

                    <p style="
                      margin: 20px 0 0;
                      font-size: 15px;
                      line-height: 1.8;
                      color: #64748b;
                    ">
                      $description
                    </p>

                  </td>
                </tr>

                <tr>
                  <td align="center" style="padding: 20px 36px 30px;">

                    <table
                      role="presentation"
                      cellpadding="0"
                      cellspacing="0"
                      border="0"
                    >
                      <tr>
                        <td
                          align="center"
                          bgcolor="#6366f1"
                          style="border-radius: 12px;"
                        >

                          <a
                            href="$action_url"
                            style="
                              display: inline-block;
                              padding: 17px 30px;
                              background-color: #6366f1;
                              border-radius: 12px;
                              font-size: 15px;
                              font-weight: 700;
                              line-height: 1.4;
                              color: #ffffff;
                              text-decoration: none;
                              text-align: center;
                            "
                          >
                            $button_label
                          </a>

                        </td>
                      </tr>
                    </table>

                  </td>
                </tr>

                <tr>
                  <td style="padding: 0 36px 28px;">

                    <table
                      role="presentation"
                      cellpadding="0"
                      cellspacing="0"
                      border="0"
                      width="100%"
                      style="
                        background-color: #f8faff;
                        border: 1px solid #e7eaf2;
                        border-radius: 12px;
                      "
                    >
                      <tr>
                        <td style="padding: 18px;">

                          <p style="
                            margin: 0;
                            font-size: 13px;
                            line-height: 1.7;
                            color: #475569;
                          ">
                            &#128274; $expiration_notice
                          </p>

                        </td>
                      </tr>
                    </table>

                  </td>
                </tr>

                <tr>
                  <td style="padding: 0 36px 36px;">

                    <p style="
                      margin: 0 0 10px;
                      font-size: 12px;
                      line-height: 1.7;
                      color: #94a3b8;
                    ">
                      Si el botón no funciona, copia este enlace
                      en tu navegador:
                    </p>

                    <p style="
                      margin: 0;
                      font-size: 12px;
                      line-height: 1.7;
                      word-break: break-all;
                    ">
                      <a
                        href="$action_url"
                        style="color: #6366f1; text-decoration: underline;"
                      >
                        $action_url
                      </a>
                    </p>

                  </td>
                </tr>

              </table>

            </td>
          </tr>

          <tr>
            <td align="center" style="padding: 28px 20px 0;">

              <p style="
                margin: 0;
                font-size: 12px;
                line-height: 1.8;
                color: #94a3b8;
                text-align: center;
              ">
                $security_notice
              </p>

              <p style="
                margin: 18px 0 0;
                font-size: 12px;
                color: #94a3b8;
              ">
                © StudyAI · Tu espacio de aprendizaje inteligente
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
